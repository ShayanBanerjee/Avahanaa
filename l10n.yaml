# Kannada matters here: Avahanaa ships in Bangalore, and the printed sticker has
# been bilingual from the start. The app being English-only meant the owner
# could read the sticker on their own windscreen but not the alert it produced.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
